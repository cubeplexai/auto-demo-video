id: cubeplex-team-sandbox
title: CubePlex team workspace sandbox demo
description: >
  Multi-model chat + sandbox deliverables (web / spreadsheet / doc) in a
  team workspace — never Personal.
product: CubePlex
adapter: cubeplex
audience: Platform engineers evaluating self-hosted agent workspaces
language: en
baseUrl: http://127.0.0.1:3000
workspaceNames:
  - Team Workspace
  - test
  - Team
forbiddenWorkspaces:
  - Personal
codeHints:
  - packages/web
auth:
  emailEnv: DEMO_EMAIL
  passwordEnv: DEMO_PASSWORD
  storageState: storage-state.json
  workspaceNames:
    - Team Workspace
    - test
  forbiddenWorkspaces:
    - Personal
cinematic:
  enabled: true
  scale: 2
  zoomInMs: 480
  zoomOutMs: 420
steps:
  - id: land
    kind: wait_ms
    ms: 1200
    label: Workspace home
    caption: Team Workspace
    highlight: true

  - id: hello
    scene: chat
    kind: send_message
    prompt: In one short sentence, say what CubePlex is — an open-source AI agent workspace for teams.
    label: Multi-model chat
    caption: Multi-model chat. Built for teams.
    highlight: true

  - id: hello_wait
    scene: chat
    kind: wait_idle
    ms: 120000

  - id: web
    scene: sandbox_web
    kind: send_message
    prompt: >
      Using the sandbox, create a single-file HTML landing page for CubePlex —
      a team AI agent workspace. Clean modern layout, no purple gradients.
      Deliver as an HTML artifact.
    label: Generate webpage
    caption: Agents work in a persistent sandbox
    highlight: true

  - id: web_wait
    scene: sandbox_web
    kind: wait_idle
    ms: 360000

  - id: xlsx
    scene: sandbox_xlsx
    kind: send_message
    prompt: >
      Using the sandbox, create sales.xlsx with three regions (APAC, EMEA, AMER)
      and Q1 monthly revenue. Summarize the top insight in chat.
    label: Analyze Excel
    caption: Analyze spreadsheets. Leave real files behind.
    highlight: true

  - id: xlsx_wait
    scene: sandbox_xlsx
    kind: wait_idle
    ms: 300000

  - id: docx
    scene: sandbox_docx
    kind: send_message
    prompt: >
      Create a one-page Word document titled "Why teams need an agent workspace"
      with three short sections. Deliver as a .docx artifact.
    label: Office document
    caption: Create Office documents as artifacts
    highlight: true

  - id: docx_wait
    scene: sandbox_docx
    kind: wait_idle
    ms: 300000

  - id: nav_skills
    scene: ops
    kind: open_panel
    name: Skills
    label: Skills
    caption: Skills · memory · governance
    highlight: true

  - id: dwell
    scene: ops
    kind: wait_ms
    ms: 2000
