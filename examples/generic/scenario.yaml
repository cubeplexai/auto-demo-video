# Product-agnostic smoke scenario.
# Put product-specific flows (workspace pickers, chat prompts, etc.) in *your* repo,
# not in auto-demo-video. Point adapter at an external module when needed:
#
#   adapter: ./adapters/my-app.mjs
#   adapterOptions: { ... }   # free-form; only your adapter reads this

id: generic-smoke
title: Generic web smoke
adapter: generic-web
baseUrl: http://127.0.0.1:3000
steps:
  - id: home
    kind: navigate
    url: /
    label: Home
    caption: Land on the product
    highlight: true
  - id: pause
    kind: wait_ms
    ms: 2000
